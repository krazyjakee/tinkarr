version: '3.8'

services:
  # Tinkarr Full Stack (Backend + Frontend)
  tinkarr:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tinkarr
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/tinkarr.db
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRES_IN=7d
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_ENABLED=true
    volumes:
      - tinkarr-data:/app/data
    depends_on:
      - flaresolverr
    restart: unless-stopped
    networks:
      - tinkarr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Flaresolverr for bypassing Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=UTC
    restart: unless-stopped
    networks:
      - tinkarr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tinkarr-data:
    driver: local

networks:
  tinkarr-network:
    driver: bridge
